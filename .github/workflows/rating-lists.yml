name: Linux Rating Lists

on:
  push:
    branches: [main]
    paths:
      - 'linux/rating_lists/**'
      - 'linux/rating_lists_integration.py'
      - 'linux/chess_publisher_linux_entry.py'
      - 'linux/build_info.py'
      - 'tests/test_rating_lists.py'
      - '.github/workflows/rating-lists.yml'
  pull_request:
    paths:
      - 'linux/rating_lists/**'
      - 'linux/rating_lists_integration.py'
      - 'linux/chess_publisher_linux_entry.py'
      - 'linux/build_info.py'
      - 'tests/test_rating_lists.py'
      - '.github/workflows/rating-lists.yml'

jobs:
  rating-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rating-list modules
        run: |
          python -m py_compile \
            linux/rating_lists/__init__.py \
            linux/rating_lists/parser.py \
            linux/rating_lists/store.py \
            linux/rating_lists_integration.py
      - name: Run deterministic rating-list tests
        run: python tests/test_rating_lists.py
