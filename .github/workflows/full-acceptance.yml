name: Linux Full Protected Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - 'tests/**'
      - 'scripts/bootstrap_dev21_from_upstream.py'
      - 'VERSION'
      - 'source_manifest.json'
      - '.github/workflows/full-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CP_RUNTIME: ${{ github.workspace }}/.runtime/materialized
    steps:
      - name: Checkout dedicated Linux source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install protected runtime dependency
        run: python -m pip install --disable-pip-version-check 'networkx>=2.6'

      - name: Materialize dev21 runtime plus current Linux overlay fail-closed
        run: |
          python scripts/bootstrap_dev21_from_upstream.py \
            --output "$CP_RUNTIME" \
            --allow-source-unavailable
          test -f "$CP_RUNTIME/MATERIALIZED_STATE.json"
          test -f "$CP_RUNTIME/linux/rating_lists_ui_integration.py"
          test -f "$CP_RUNTIME/linux/rating_lists/store.py"
          test -f "$CP_RUNTIME/linux/web_results_download.js"
          test -f "$CP_RUNTIME/linux/web_results_download_integration.py"
          test -f "$CP_RUNTIME/linux/cloud_unified_sync.js"
          test -f "$CP_RUNTIME/linux/cloud_unified_sync_integration.py"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ['CP_RUNTIME']) / 'MATERIALIZED_STATE.json').read_text())
          assert state['protectedSourceVerified'] is False, state
          assert state['oldUpstreamRootSourceAllowed'] is False, state
          assert state['protectedSourceOrigin'] == 'unavailable', state
          print('HOSTED_PROTECTED_SOURCE_FAIL_CLOSED=PASS')
          PY
          if [ -e "$CP_RUNTIME/source/ChessPublisher.html" ]; then
            echo '::error::Hosted materializer substituted a protected source file unexpectedly.'
            exit 1
          fi

      - name: Verify current Linux overlay identity
        run: |
          grep -F 'linux-dev.23' "$CP_RUNTIME/linux/build_info.py"
          grep -F 'apply_rating_lists_ui()' "$CP_RUNTIME/linux/chess_publisher_linux_entry.py"
          grep -F 'apply_web_results_download()' "$CP_RUNTIME/linux/chess_publisher_linux_entry.py"
          grep -F 'apply_cloud_unified_sync()' "$CP_RUNTIME/linux/chess_publisher_linux_entry.py"
          grep -F 'Download Results' "$CP_RUNTIME/linux/web_results_download.js"
          grep -F '/arbiter-results/ack' "$CP_RUNTIME/linux/web_results_download.js"
          grep -F '⟳ SYNC' "$CP_RUNTIME/linux/cloud_unified_sync.js"
          grep -F 'legacyCloudRefreshList' "$CP_RUNTIME/linux/cloud_unified_sync.js"

      - name: Compile runtime and Linux modules
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python -m py_compile linux/*.py linux/rating_lists/*.py ci/*.py packaging/*.py tests/*.py
          node --check linux/LinuxWebViewShim.js
          node --check linux/export_integration.js
          node --check linux/web_results_download.js
          node --check linux/cloud_unified_sync.js
          node --check tests/web_results_reconcile_contract.mjs
          node --check tests/web_results_pending_flow_contract.mjs
          node --check tests/cloud_unified_sync_contract.mjs
          node --check tests/cloud_sync_dev23_regression.mjs
          node --check ci/webview_shim_contract.mjs
          node --check ci/telegram_webview_contract.mjs
          node --check ci/online_token_webview_contract.mjs
          node --check ci/export_webview_contract.mjs

      - name: Run deterministic Linux integration contracts
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python tests/test_rating_lists.py
          python tests/test_rating_lists_ui.py
          python tests/test_materialize_script.py
          python tests/test_web_results_download.py
          node tests/web_results_reconcile_contract.mjs
          node tests/web_results_pending_flow_contract.mjs
          node tests/cloud_unified_sync_contract.mjs
          node tests/cloud_sync_dev23_regression.mjs

      - name: Run protected-source policy and adapter contracts
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python ci/source_guard_contract.py
          python ci/source_bootstrap_contract.py
          python ci/bbp_adapter_contract.py
          python ci/linux_adapter_order_contract.py
          python ci/dgt_contract_smoke.py
          node ci/webview_shim_contract.mjs
          node ci/online_token_webview_contract.mjs
          python ci/online_token_runtime_contract.py
          python ci/telegram_contract_smoke.py
          node ci/telegram_webview_contract.mjs
          python ci/desktop_contract_smoke.py
          python ci/export_contract_smoke.py
          node ci/export_webview_contract.mjs
          python ci/browser_launcher_contract.py
          python ci/window_mode_contract.py

      - name: Run real Chromium UI gates
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python ci/window_browser_contract.py
          python ci/chromium_runtime_smoke.py
          set +e
          python ci/chromium_runtime_smoke.py --exact-drive-ui
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then exit 0; fi
          exit "$rc"

      - name: Run FIDE and integrated rating-list gates
        working-directory: ${{ env.CP_RUNTIME }}
        shell: bash
        run: |
          python ci/fide_contract_smoke.py
          python ci/fide_download_strategy_contract.py
          python ci/fide_cache_contract.py
          set +e
          python ci/fide_live_download_contract.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then exit "$rc"; fi
          python ci/fide_endpoint_contract.py
          python ci/fide_legacy_limits_contract.py
          python ci/fide_streaming_contract.py
          python tests/test_rating_lists.py

      - name: Run Chess-Results and LocalEngine gates
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python ci/chess_results_contract_smoke.py
          python ci/live_acceptance_contract.py
          python ci/localengine_contract_smoke.py
          python ci/self_test_contract.py
          python ci/self_test_contract.py --online-engines

      - name: Install and self-test packages on Ubuntu 24.04 and 26.04
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python ci/deb_install_smoke.py
          python ci/ubuntu_2604_container_smoke.py

      - name: Run TRF16 TRF26 Gacrux BBP Tie-Break acceptance
        working-directory: ${{ env.CP_RUNTIME }}
        run: |
          python ci/trf_compat_acceptance.py
          python ci/real_acceptance.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev23-full-acceptance-report
          path: ${{ env.CP_RUNTIME }}/tests/logs/real-linux-acceptance.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload accepted runtime-only kit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-linux-dev23-runtime-only-kit
          path: |
            ${{ env.CP_RUNTIME }}/linux
            ${{ env.CP_RUNTIME }}/packaging
            ${{ env.CP_RUNTIME }}/source_manifest.json
            ${{ env.CP_RUNTIME }}/fide-cache
            ${{ env.CP_RUNTIME }}/VERSION
            ${{ env.CP_RUNTIME }}/MATERIALIZED_STATE.json
          if-no-files-found: error
          retention-days: 14
