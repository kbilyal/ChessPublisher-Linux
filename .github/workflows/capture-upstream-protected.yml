name: Capture Upstream Protected Baseline

on:
  push:
    paths:
      - '.github/workflows/capture-upstream-protected.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable upstream dev21 source
        uses: actions/checkout@v4
        with:
          repository: kbilyal/ChessPublisher
          ref: 5e0b37708cbef2828ec60d7e6faa247d4ecc904d
          path: upstream
      - name: Stage upstream HTML baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captured
          cp upstream/ChessPublisher.html captured/ChessPublisher.html
          sha256sum captured/ChessPublisher.html > captured/SHA256SUMS.txt
          wc -c captured/ChessPublisher.html
      - name: Upload captured baseline
        uses: actions/upload-artifact@v4
        with:
          name: upstream-dev21-html-baseline
          path: captured
          retention-days: 7
