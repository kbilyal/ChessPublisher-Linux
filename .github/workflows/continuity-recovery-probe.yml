name: Linux Continuity Recovery Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuity-recovery-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download accepted dev21 runtime artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: kbilyal/ChessPublisher
          run-id: 34251523583
          name: chess-publisher-linux-runtime-kit
          path: .runtime/dev21-artifact
      - name: Verify runtime continuity boundary
        run: |
          set -euxo pipefail
          test -f .runtime/dev21-artifact/linux/chess_publisher_linux_entry.py
          test -f .runtime/dev21-artifact/linux/build_info.py
          test -f .runtime/dev21-artifact/packaging/build_deb.py
          test -f .runtime/dev21-artifact/source_manifest.json
          if find .runtime/dev21-artifact -type f -name 'ChessPublisher.html' | grep -q .; then
            echo '::error::Accepted runtime-only artifact unexpectedly contains protected source.'
            exit 1
          fi
          grep -F '1.06.00-beta.34-linux-dev.21' .runtime/dev21-artifact/linux/build_info.py
          echo 'DEV21_RUNTIME_ARTIFACT_CONTINUITY=PASS'
          echo 'DEV21_RUNTIME_ARTIFACT_NO_PROTECTED_SOURCE=PASS'
          echo '::notice::Exact protected source is a separate SHA256-pinned package input and was never part of the dev21 runtime artifact.'
