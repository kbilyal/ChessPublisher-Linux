name: Linux Continuity Recovery Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuity-recovery-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact dev21 runtime artifact from upstream acceptance
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: kbilyal/ChessPublisher
          run-id: 34251523583
          name: chess-publisher-linux-runtime-kit
          path: .runtime/dev21-artifact
      - name: Inspect recovered artifact
        run: |
          set -euxo pipefail
          find .runtime/dev21-artifact -maxdepth 3 -type f | sort | head -120
          find .runtime/dev21-artifact -type f -name 'ChessPublisher.html' -print -exec sha256sum {} \;
          test "$(find .runtime/dev21-artifact -type f -name ChessPublisher.html -exec sha256sum {} \; | awk '{print $1}' | head -1)" = "f51355b1a449870be6ed69d1bb941c19a9d8d2bdf3c8f91da845b4bc1275f310"
          echo 'DEV21_ARTIFACT_PROTECTED_SOURCE=PASS'
